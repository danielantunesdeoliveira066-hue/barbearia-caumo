<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0c0b09">
<title>Agenda</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="w" id="login" hidden>
  <form class="lg" id="lf">
    <h1>Agenda</h1>
    <p>Acesso do barbeiro.</p>
    <input id="em" type="email" autocomplete="username" placeholder="E-mail" required>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Senha" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="msg" id="lm" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="top"><div class="w">
    <div class="brand">Agenda<small id="nome"></small></div>
    <button class="btn o sm" id="out">Sair</button>
  </div></header>
  <main class="w">
    <div class="vt" role="group" aria-label="Período">
      <button class="chip sel" data-v="next" aria-pressed="true">Próximos</button>
      <button class="chip sel" data-v="past" aria-pressed="false">Passados</button>
      <button class="chip" id="rf" aria-label="Atualizar">Atualizar</button>
    </div>
    <p class="msg" id="msg" role="alert"></p>
    <div id="list"></div>

    <details class="bk" id="bk">
      <summary>Bloquear horário (folga, compromisso)</summary>
      <form id="bf">
        <label>Dia<input id="bd" type="date" required></label>
        <div class="r2">
          <label>Início<input id="bi" type="time" required></label>
          <label>Fim<input id="bt" type="time" required></label>
        </div>
        <label>Motivo (opcional)<input id="bn" placeholder="Ex.: almoço, médico"></label>
        <button class="btn" type="submit">Bloquear</button>
        <p class="msg" id="bm" role="alert"></p>
      </form>
    </details>
  </main>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>

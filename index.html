<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agende seu horário</title>
<meta name="description" content="">
<meta name="theme-color" content="#0c0b09">
<!-- TROCAR 3 LINHAS POR CLIENTE (prévia do WhatsApp/Instagram não executa JavaScript): og:title, og:description e o endereço do og:image -->
<meta property="og:title" content="Barbearia Caumo — Constantina, RS">
<meta property="og:description" content="Escolha o serviço, o dia e o horário. Confirmação pelo WhatsApp.">
<meta property="og:image" content="https://barbearia-caumo.vercel.app/img/og.jpg">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="w">
  <div class="brand"></div>
  <div class="status" id="st"><i class="dot"></i><span></span></div>
</div></header>

<main class="w">
  <div class="hero">
    <div>
      <h1 id="h1"></h1>
      <p id="sub"></p>
      <a class="btn" href="#servicos">Ver serviços e preços</a>
    </div>
    <img src="img/hero.webp" width="760" height="956" alt="" fetchpriority="high" decoding="async">
  </div>

  <section id="servicos">
    <h2>Serviços</h2>
    <div class="tabs" id="tabs" role="group" aria-label="Categorias"></div>
    <div id="list"></div>
  </section>

  <section aria-label="O espaço">
    <h2>O espaço</h2>
    <div class="rail" tabindex="0" role="region" aria-label="Fotos da barbearia">
      <img loading="lazy" decoding="async" src="img/g1.webp" alt="">
      <img loading="lazy" decoding="async" src="img/g2.webp" alt="">
      <img loading="lazy" decoding="async" src="img/g3.webp" alt="">
      <img loading="lazy" decoding="async" src="img/g4.webp" alt="">
      <img loading="lazy" decoding="async" src="img/g5.webp" alt="">
    </div>
  </section>

  <section id="local" class="loc">
    <div>
      <h2>Como chegar</h2>
      <dl id="info"><dt>Endereço</dt><dd id="end"></dd></dl>
      <div class="acts">
        <a class="btn" id="mapa" target="_blank" rel="noopener" href="#">Abrir no mapa</a>
        <a class="btn o wa" href="#" data-m="Olá! Tenho uma dúvida.">Tirar dúvida</a>
        <a class="btn o" id="ig" target="_blank" rel="noopener" href="#">Instagram</a>
      </div>
    </div>
  </section>
</main>
<footer class="w" id="rod"></footer>

<div class="bar" role="region" aria-label="Resumo do agendamento"><div>
  <div aria-live="polite"><b id="tot">Escolha acima</b><span id="meta">Toque em um serviço</span></div>
  <button class="btn" id="go">Agendar</button>
</div></div>

<dialog id="sh" aria-labelledby="sht"><div class="sh">
  <div class="sh-h"><h3 id="sht">Dia e horário</h3><button class="x" id="cl" aria-label="Fechar">✕</button></div>
  <div><p class="lbl">Dia</p><div class="days" id="days"></div></div>
  <div><p class="lbl">Horário</p><div class="slots" id="slots"></div></div>
  <div><p class="lbl">Seu nome</p><input id="nm" autocomplete="name" placeholder="Como podemos te chamar?"></div>
  <div class="sum"><span id="sv"></span><b id="sp"></b></div>
  <button class="btn" id="ok" disabled>Confirmar pelo WhatsApp</button>
</div></dialog>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
